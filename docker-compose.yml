services:
  postgres:
    image: postgres:16-alpine
    container_name: parlaypal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parlaypal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parlaypal}
      POSTGRES_DB: ${POSTGRES_DB:-parlaypal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parlaypal} -d ${POSTGRES_DB:-parlaypal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: parlaypal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
